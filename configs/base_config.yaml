# Base Configuration for HPMA Replication
system:
  device: "cuda"
  seed: 42
  num_workers: 4

data:
  input_resolution: [1008, 1008]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  feature_dim: 256
  input_channels: 3
  num_prototypes_k: 4
  visual_token_grid: [4, 4]
  sam3_checkpoint: "checkpoints/sam3.1.pt"
  unfreeze_vision_blocks: 4
  unfreeze_fusion_layers: 2

training:
  epochs: 20
  batch_size: 2
  gradient_accumulation_steps: 4
  mixed_precision: true
  learning_rate:
    base: 8.0e-5
    vision_backbone: 2.5e-5
  weight_decay: 1.0e-4
  loss_weights:
    lambda_align: 0.01

