[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpma-sam"
version = "0.1.0"
description = "Image-only 2D prototype-memory segmentation with SAM 3.1"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Research Team", email = "research@example.com"}
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "nibabel>=5.0.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flake8>=7.0.0",
    "black>=24.0.0",
    "isort>=5.13.0"
]

[tool.setuptools.packages.find]
include = [
    "data*",
    "losses*",
    "memory*",
    "models*",
    "tools*",
    "utils*",
]
exclude = [
    "checkpoints*",
    "configs*",
    "dataset*",
    "docs*",
    "Reference*",
    "scripts*",
    "tests*",
]

[tool.black]
line-length = 100
